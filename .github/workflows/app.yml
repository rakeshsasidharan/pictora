name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-west-2
  ECR_REPO: hermes-app
  SSM_DIGEST_PARAM: /hermes/app-image-digest

jobs:
  # ── Tests (no AWS required) ──────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            infra/package-lock.json
            infra/lambda/inbound-email-processor/package-lock.json
            infra/lambda/ws-connect/package-lock.json
            infra/lambda/cleanup-expired-messages/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Type-check app
        working-directory: app
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint app
        working-directory: app
        run: npm run lint

      - name: Run app tests
        working-directory: app
        run: npm test -- --no-coverage

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Install inbound-email-processor dependencies
        working-directory: infra/lambda/inbound-email-processor
        run: npm ci

      - name: Install ws-connect dependencies
        working-directory: infra/lambda/ws-connect
        run: npm ci

      - name: Install cleanup-expired-messages dependencies
        working-directory: infra/lambda/cleanup-expired-messages
        run: npm ci

      - name: Run infra tests
        working-directory: infra
        run: npm test

  # ── CDK diff on PRs (requires AWS OIDC) ─────────────────────────────────────
  cdk-diff:
    if: github.event_name == 'pull_request'
    name: CDK diff
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            infra/package-lock.json
            infra/lambda/inbound-email-processor/package-lock.json
            infra/lambda/ws-connect/package-lock.json
            infra/lambda/cleanup-expired-messages/package-lock.json

      - name: Configure AWS credentials (OIDC)
        id: aws-creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Install inbound-email-processor dependencies
        working-directory: infra/lambda/inbound-email-processor
        run: npm ci

      - name: Install ws-connect dependencies
        working-directory: infra/lambda/ws-connect
        run: npm ci

      - name: Install cleanup-expired-messages dependencies
        working-directory: infra/lambda/cleanup-expired-messages
        run: npm ci

      - name: CDK diff
        if: steps.aws-creds.outcome == 'success'
        id: cdk-diff
        working-directory: infra
        run: npx cdk diff --all 2>&1 | tee /tmp/cdk-diff.txt || true

      - name: Post CDK diff as PR comment
        if: steps.aws-creds.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/cdk-diff.txt', 'utf8');
            const body = `## CDK Diff\n\`\`\`\n${diff.slice(0, 60000)}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## CDK Diff'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Deploy on push to main (requires AWS OIDC) ───────────────────────────────
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            infra/package-lock.json
            infra/lambda/inbound-email-processor/package-lock.json
            infra/lambda/ws-connect/package-lock.json
            infra/lambda/cleanup-expired-messages/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Install inbound-email-processor dependencies
        working-directory: infra/lambda/inbound-email-processor
        run: npm ci

      - name: Install ws-connect dependencies
        working-directory: infra/lambda/ws-connect
        run: npm ci

      - name: Install cleanup-expired-messages dependencies
        working-directory: infra/lambda/cleanup-expired-messages
        run: npm ci

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'app/**'
            infra:
              - 'infra/**'

      - name: Log in to Amazon ECR
        if: steps.changes.outputs.app == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get deployed WebSocket endpoint
        if: steps.changes.outputs.app == 'true'
        id: ws-endpoint
        run: |
          WS_ENDPOINT=$(aws cloudformation list-exports \
            --query "Exports[?Name=='HermesWebSocketEndpoint'].Value" \
            --output text 2>/dev/null || echo "")
          echo "endpoint=$WS_ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image to ECR
        if: steps.changes.outputs.app == 'true'
        id: docker-build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPO"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --build-arg NEXT_PUBLIC_WEBSOCKET_ENDPOINT="${{ steps.ws-endpoint.outputs.endpoint }}" \
            --tag "$IMAGE_URI:${{ github.sha }}" \
            --tag "$IMAGE_URI:latest" \
            app/
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_URI:${{ github.sha }}" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Write image digest to SSM
        if: steps.changes.outputs.app == 'true'
        run: |
          aws ssm put-parameter \
            --name "$SSM_DIGEST_PARAM" \
            --value "${{ steps.docker-build.outputs.digest }}" \
            --type String \
            --overwrite

      - name: Read image digest from SSM (infra-only deploy)
        if: steps.changes.outputs.app != 'true'
        id: read-digest
        run: |
          DIGEST=$(aws ssm get-parameter --name "$SSM_DIGEST_PARAM" --query Parameter.Value --output text 2>/dev/null || echo "")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: CDK deploy
        working-directory: infra
        env:
          IMAGE_DIGEST: ${{ steps.docker-build.outputs.digest || steps.read-digest.outputs.digest }}
        run: |
          DEPLOY_ARGS="--all --require-approval never"
          if [ -n "$IMAGE_DIGEST" ]; then
            DEPLOY_ARGS="$DEPLOY_ARGS --context imageDigest=$IMAGE_DIGEST"
          fi
          npx cdk deploy $DEPLOY_ARGS
