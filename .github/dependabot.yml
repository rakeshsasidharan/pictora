# Dependency updates (CI/CD design 4 and 7).
version: 2
updates:
  # One root lockfile covers every npm workspace. Minor and patch updates come as one grouped PR a week;
  # major updates stay separate, since they need a closer look.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Node types follow the runtime major, and TypeScript majors wait for typescript-eslint support.
    # Both are upgraded by hand.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Base images and the Lambda Web Adapter in the app and worker Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /app
      - /worker
    schedule:
      interval: monthly
    # The Node major moves to a new LTS by hand, together with CI and @types/node.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
